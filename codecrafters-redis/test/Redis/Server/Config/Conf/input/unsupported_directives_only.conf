################################## MEMORY MANAGEMENT ################################

# Set a memory usage limit to the specified amount of bytes.
maxmemory 100mb

# How Redis will select what to remove when maxmemory is reached.
maxmemory-policy noeviction

################################## APPEND ONLY MODE ###############################

appendonly no
appendfilename "appendonly.aof"

# TCP keepalive.
tcp-keepalive 300
