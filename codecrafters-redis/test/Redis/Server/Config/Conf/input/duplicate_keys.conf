################################## NETWORK #####################################

# Baseline settings. Every supported directive below is repeated further down,
# with a distinct value each time, so the loader must end up with the LAST
# occurrence of each one, matching how redis applies a config file line by line.
port 6379
replicaof "no one"

################################ SNAPSHOTTING  ################################

dir /var/lib/redis
dbfilename dump.rdb
rdbcompression yes
rdbchecksum no

################################## OVERRIDES ###################################

# Overrides added later by an operator
port 6380 # moved off the default
replicaof 10.0.0.1 6379
dir data
rdbcompression no


# Final overrides, these should win
replicaof 10.0.0.2 6379
dir /data/redis
rdbchecksum yes
port 6381
# trailing comment
